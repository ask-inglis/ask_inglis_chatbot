<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AskInglis</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; }
  #chat { border: 1px solid #ccc; padding: 10px; height: 450px; overflow-y: auto; margin-bottom: 10px; white-space: pre-wrap; }
  .msg { margin: 10px 0; }
  .user { font-weight: bold; }
  input { width: 78%; padding: 8px; }
  button { padding: 8px 16px; }
</style>
</head>
<body>
  <h2>🦴 AskInglis</h2>
  <p style="color: #666; font-size: 14px;">Ask a question about the course notes.</p>
  <div id="chat"></div>
  <input id="question" type="text" placeholder="Type your question..." />
  <button onclick="sendMessage()">Send</button>

  <script>
    const BACKEND_URL = "http://localhost:8000"; // update after deploying

    async function sendMessage() {
      const input = document.getElementById("question");
      const message = input.value.trim();
      if (!message) return;

      const chat = document.getElementById("chat");
      chat.innerHTML += `<div class="msg user">You: ${message}</div>`;
      input.value = "";

      chat.innerHTML += `<div class="msg" id="loading">Thinking...</div>`;
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch(`${BACKEND_URL}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();

        document.getElementById("loading").remove();
        chat.innerHTML += `<div class="msg">AskInglis: ${data.reply}</div>`;
      } catch (err) {
        document.getElementById("loading").remove();
        chat.innerHTML += `<div class="msg">Error: could not reach the server.</div>`;
      }

      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById("question").addEventListener("keypress", function(e) {
      if (e.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
