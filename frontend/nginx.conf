server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / { return 302 /ask_inglis_chatbot/; }
    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }

    # Files with a hash in the name never change, so browsers may keep them for a year.
    location /ask_inglis_chatbot/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /ask_inglis_chatbot/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /ask_inglis_chatbot/index.html;
    }
}
