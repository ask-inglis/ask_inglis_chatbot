# Production on the droplet. Run:  docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --build
# Needs a file named .env.prod next to this file and backend/.env.
# No ports are published. The proxy project (ask_inglis_proxy) reaches these containers over the shared "web" network.
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    volumes:
      - chroma_store:/app/chroma_store
      - chatlog:/app/chatlog
    restart: unless-stopped
    networks:
      default: {}
      web:
        aliases: [chatbot-backend]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: https://${API_HOST}
    restart: unless-stopped
    networks:
      default: {}
      web:
        aliases: [chatbot-frontend]

volumes:
  chroma_store:
  chatlog:

networks:
  web:
    external: true